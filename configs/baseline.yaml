# ORION Sprint 1 — baseline experiment config
dataset:
  root: data
  category: synthetic_widget      # swap for an MVTec AD category when available
  image_size: 64
  val_fraction: 0.2
  mode: supervised_split          # supervised_split (both classes in train) | mvtec_oneclass

model:
  name: small_cnn                 # resnet18 | small_cnn
  pretrained: false               # small_cnn ignores this; set true for resnet18 w/ net access

train:
  seed: 42
  epochs: 5
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001

output:
  dir: runs
